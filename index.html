<!DOCTYPE html>
<html lang="en" translate="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="content-language" content="en">
  <meta name="google" content="notranslate">
  <title>Matching Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Outfit:wght@300..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>

  <header class="header">
    <div class="container header-content">
      <div class="header-left">
        <div class="pairs-input-container">
          <label class="pairs-input-lable" for="pairs-input">
            Matches
            <svg class="adjust-icon" width="16" height="16" viewBox="0 0 24 24">
              <path
                d="m12 19.24-4.95-4.95-1.41 1.42L12 22.07l6.36-6.36-1.41-1.42L12 19.24zM5.64 8.29l1.41 1.42L12 4.76l4.95 4.95 1.41-1.42L12 1.93 5.64 8.29z" />
            </svg>
          </label>
          <input type="number" id="pairs-input" value="8" min="2" max="50" class="pairs-input">
        </div>
      </div>
      <h1 class="header-title">Match Maker</h1>
      <div class="header-right">
        <div id="tries-display" class="tries-display">Tries: 0</div>
        <button id="reset-button" class="reset-btn">Reset</button>
        <button id="menu-toggle" class="icon-button settings-toggle-btn" aria-label="Open Settings" title="Open Settings">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
      <div id="player-scores-container" class="player-scores-container">
        <div id="player-scores" class="player-scores">
          <!-- Player scores will be added here dynamically -->
        </div>
        <div class="player-controls">
          <button id="shuffle-btn" class="shuffle-btn">Shuffle Players</button>
          <button id="drag-btn" class="drag-btn">Start</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container main-container">
    <div id="game-board" class="game-board">
      <!-- Cards will be added here dynamically -->
    </div>
    <div id="active-units-label" class="active-units-label"></div>
  </main>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div id="settings-sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Game Settings</h2>
      <button id="sidebar-close" class="close-btn" aria-label="Close Settings">&times;</button>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-section">
        <div class="sidebar-section-header">
          <h3 class="sidebar-section-title">Select Cards</h3>
          <button id="reset-units-btn" class="reset-units-btn" title="Remove all units">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
        </div>
        <select id="unit-selector" class="sidebar-select"></select>
        <div id="selected-units-list" class="selected-units-list"></div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Players Setup</h3>
        <div class="player-input-content">
          <div class="player-set-loader-container">
            <select id="player-set-select" class="sidebar-select">
              <option value="">-- Load Saved List --</option>
            </select>
            <button id="delete-set-btn" class="sidebar-btn secondary-btn" title="Delete selected list" style="display: none;">Delete</button>
          </div>
          <textarea id="player-names-input" class="player-names-input"
            placeholder="Separate names with a comma or a new line"></textarea>
          <div class="player-set-saver-container">
            <input type="text" id="new-set-name" class="sidebar-input" placeholder="List name...">
            <button id="save-set-btn" class="sidebar-btn secondary-btn">Save</button>
          </div>
          <button id="add-players-btn" class="sidebar-btn">Add Players</button>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Rules</h3>
        <button id="rules-button" class="sidebar-btn">Bonus Turns</button>
      </div>
      
      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Sync Settings</h3>
        <details id="sync-settings-details" class="voice-settings-details">
          <summary id="sync-settings-summary">Upstash Redis Config</summary>
          <div class="voice-settings-content">
            <div class="api-key-container">
              <label for="upstash-url-input">Upstash REST URL</label>
              <input type="text" id="upstash-url-input" class="sidebar-input" placeholder="https://...upstash.io">
            </div>
            <div class="api-key-container">
              <label for="upstash-token-input">Upstash REST Token</label>
              <input type="password" id="upstash-token-input" class="sidebar-input" placeholder="Enter Token">
            </div>
            <button id="save-sync-btn" class="sidebar-btn">Save & Sync</button>
            <div id="sync-status" class="api-key-status"></div>
          </div>
        </details>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Voice Settings</h3>
        <details id="voice-settings-details" class="voice-settings-details">
          <summary id="voice-settings-summary">ElevenLabs Config</summary>
          <div class="voice-settings-content">
            <div class="api-key-container">
              <label for="api-key-input">ElevenLabs API Key</label>
              <input type="password" id="api-key-input" class="sidebar-input" placeholder="Enter API Key">
              <button id="save-api-key-btn" class="sidebar-btn">Verify & Save</button>
            </div>
            <div id="api-key-status" class="api-key-status"></div>
            <button id="reset-voices-btn" class="sidebar-btn secondary-btn" style="margin-top: var(--space-xs);">Reset Cached Voices</button>
          </div>
        </details>
      </div>

    </div>
  </div>

  <div id="completion-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Congratulations! 🎉</h2>
      <p>You've completed the game in <span id="final-score"></span> tries.</p>
      <div class="modal-scores">
        <div id="modal-player-scores" class="player-scores">
          <!-- Player scores will be added here dynamically -->
        </div>
      </div>
      <button id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
